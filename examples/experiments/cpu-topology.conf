# Report fewer CPUs to a Windows game. Old engines often scale badly with many cores.
# WINE_CPU_TOPOLOGY=N uses the first N host CPUs; N:a,b,c,... picks them (logical CPU numbers).
# Note: the override reports no SMT pairs, so games that read the core layout may behave differently.
label=topo4
mangohud=1
bench_window=
threadwatch=1
env WINE_CPU_TOPOLOGY=4
