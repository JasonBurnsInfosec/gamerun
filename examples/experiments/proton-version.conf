# Launch the same game with another Proton build by rewriting the path Steam passes in %command%.
# The replacement must be installed and use the same Steam Linux Runtime as the original (compare the
# runtime in the "command" field of a manifest); otherwise switch Proton in Steam's properties instead.
label=proton-ge
mangohud=1
bench_window=
replace=steamapps/common/Proton - Experimental=>compatibilitytools.d/GE-Proton10-1
