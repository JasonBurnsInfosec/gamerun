# WineD3D (Direct3D on OpenGL) instead of DXVK, for Direct3D 8-11 games. Useful to tell DXVK issues apart
# from game or Wine issues. WineD3D renders through OpenGL, which MangoHud's Vulkan layer does not see, so
# the mangohud --dlsym wrapper is added; if no frame log appears, check MangoHud's OpenGL notes for Proton.
label=wined3d
mangohud=1
mangohud_opengl=1
bench_window=
env PROTON_USE_WINED3D=1
